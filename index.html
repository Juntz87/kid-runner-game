<title>Kid Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:monospace;user-select:none}
h1{font-size:1.3rem;margin-bottom:8px;color:#333;letter-spacing:2px}
#arena{position:relative;width:800px;height:280px;background:#fff;border-bottom:3px solid #333;overflow:hidden}
#player{position:absolute;bottom:2px;left:70px;width:65px;height:65px;border-radius:50%;overflow:hidden;border:3px solid #e44;background:#fff}
#player img{width:100%;height:100%;object-fit:cover;object-position:center top}
.obs{position:absolute;bottom:2px;background:#2d8a2d;border-radius:3px 3px 0 0}
.cloud{position:absolute;background:#ccc;border-radius:20px;opacity:.4}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#444;text-align:center;padding:20px;line-height:1.6}
#hud{display:flex;gap:40px;margin-top:10px;font-size:1rem;color:#555}

<div id="hud">
  <span>SCORE: <b id="sc">0</b></span>
  <span>BEST: <b id="hi">0</b></span>
</div>
<script>
const arena=document.getElementById('arena'),player=document.getElementById('player'),overlay=document.getElementById('overlay'),scEl=document.getElementById('sc'),hiEl=document.getElementById('hi');
let state='idle',vy=0,y=2,score=0,hi=0,frame=0,speed=4,obs=[],clouds=[],raf;
const G=0.65,JF=-15,PS=65;
function jump(){if(state!=='running'){startGame();return;}if(y<=2.5)vy=JF;}
function startGame(){state='running';y=2;vy=0;score=0;speed=4;frame=0;obs.forEach(o=>o.el.remove());obs=[];clouds.forEach(c=>c.el.remove());clouds=[];overlay.style.display='none';cancelAnimationFrame(raf);tick();}
function tick(){raf=requestAnimationFrame(tick);frame++;vy+=G;y-=vy;if(y<=2){y=2;vy=0;}const bob=(y<=2.5)?Math.sin(frame*0.3)*2.5:0;player.style.bottom=(y+bob)+'px';player.style.transform=vy<-1?'rotate(-12deg)':vy>2?'rotate(10deg)':'rotate(0)';speed=4+score/800;if(frame%Math.max(70,140-Math.floor(score/30))===0){const h=38+Math.random()*60,w=24+Math.random()*14,el=document.createElement('div');el.className='obs';el.style.cssText=`width:${w}px;height:${h}px;left:810px`;arena.appendChild(el);obs.push({el,x:810,w,h});}if(frame%90===0){const cw=50+Math.random()*70,ch=16+Math.random()*16,el=document.createElement('div');el.className='cloud';el.style.cssText=`width:${cw}px;height:${ch}px;top:${15+Math.random()*80}px;left:810px`;arena.appendChild(el);clouds.push({el,x:810});}for(let i=obs.length-1;i>=0;i--){obs[i].x-=speed;obs[i].el.style.left=obs[i].x+'px';const pad=10,ox=obs[i].x,ow=obs[i].w,oh=obs[i].h;if(70+PS-pad>ox+pad&&70+pad<ox+ow-pad&&y<oh+2)return die();if(obs[i].x<-60){obs[i].el.remove();obs.splice(i,1);}}clouds.forEach((c,i)=>{c.x-=speed*0.25;c.el.style.left=c.x+'px';if(c.x<-200){c.el.remove();clouds.splice(i,1);}});score++;scEl.textContent=score;}
function die(){state='dead';cancelAnimationFrame(raf);if(score>hi){hi=score;hiEl.textContent=hi;}player.style.transform='rotate(90deg)';overlay.style.display='flex';overlay.innerHTML='GAME OVER &#128565;<br><small>Score: '+score+' | Best: '+hi+'</small><br><small style="color:#999">SPACE / TAP to retry</small>';}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
arena.addEventListener('click',jump);
arena.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
</script>
